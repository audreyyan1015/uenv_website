<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UEnv 文档：了解架构，完成部署，运行评测与强化学习训练，接入强化学习框架并维护服务。"
    />
    <meta name="theme-color" content="#f7f9fc" />
    <title>UEnv 文档</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到正文</a>

    <header class="topbar">
      <div class="topbar-inner">
        <button class="icon-button mobile-only" id="menuButton" type="button" aria-label="打开文档目录" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>

        <a class="brand" href="./" aria-label="UEnv 文档首页">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">UEnv</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-subtitle">文档</span>
        </a>

        <nav class="topnav" aria-label="文档主导航">
          <!-- DOCS:TOPNAV -->
        </nav>

        <div class="top-actions">
          <button class="search-trigger" id="searchButton" type="button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
            <span>搜索文档</span>
            <kbd><span class="system-key">Ctrl</span> K</kbd>
          </button>
          <a class="product-link" href="../" aria-label="返回 UEnv 首页">UEnv 首页</a>
        </div>
      </div>
    </header>

    <div class="page-shell">
      <aside class="sidebar" id="sidebar" aria-label="UEnv 文档目录" tabindex="-1">
        <div class="sidebar-inner">
          <a class="sidebar-product-link" href="../">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            返回 UEnv 首页
          </a>
          <!-- DOCS:SIDEBAR -->
        </div>
      </aside>

      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

      <main id="main" class="content">
        <article>
          <nav class="breadcrumbs page-breadcrumbs" aria-label="面包屑">
            <a href="./">UEnv 文档</a>
            <span aria-hidden="true">/</span>
            <a id="breadcrumbSection" href="./">了解 UEnv</a>
            <span id="breadcrumbSubsectionSeparator" aria-hidden="true" hidden>/</span>
            <span id="breadcrumbSubsection" hidden></span>
            <span aria-hidden="true">/</span>
            <strong id="breadcrumbCurrent">UEnv 文档</strong>
          </nav>

          <details class="inline-toc" id="inlineToc">
            <summary>本页内容</summary>
            <nav id="inlineTocNav" aria-label="本页标题目录"></nav>
          </details>

          <!-- DOCS:CONTENT -->

          <nav class="page-pagination" id="pagePagination" aria-label="UEnv 文档分页"></nav>
        </article>
      </main>

      <aside class="toc" aria-label="本页目录">
        <p>本页内容</p>
        <nav id="tocNav" aria-label="本页标题目录"></nav>
      </aside>
    </div>

    <div class="search-dialog" id="searchDialog" role="dialog" aria-modal="true" aria-labelledby="searchDialogTitle" hidden>
      <div class="search-panel">
        <h2 class="visually-hidden" id="searchDialogTitle">搜索 UEnv 文档</h2>
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input id="searchInput" type="search" aria-label="搜索 UEnv 文档" aria-controls="searchResults" aria-autocomplete="list" placeholder="搜索部署、评测、训练、轨迹或框架接入…" autocomplete="off" />
          <button class="search-close" id="searchCloseButton" type="button" aria-label="关闭搜索">关闭</button>
        </div>
        <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>
        <p class="search-hint"><kbd>↑</kbd><kbd>↓</kbd> 选择　<kbd>Enter</kbd> 打开　<kbd>Esc</kbd> 关闭</p>
      </div>
    </div>

    <!-- DOCS:PAGE_DATA -->
    <!-- Mermaid runtime is loaded on demand by app.js (only for pages that
         contain diagrams); keep the local path in data-mermaid-src. -->
    <script src="./app.js" data-mermaid-src="./vendor/mermaid.min.js" defer></script>
  </body>
</html>
